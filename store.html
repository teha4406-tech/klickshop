<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الكتالوج | KlikShop</title>
  <link rel="stylesheet" href="store.css">
  <meta name="theme-color" content="#4f46e5">
</head>
<body>
  <div id="state" class="state">جاري التحميل...</div>

  <div id="app" hidden>
    <header class="hdr"><div class="in">
      <img id="logo" alt="" hidden>
      <div><h1 id="sName"></h1><p id="sDesc"></p></div>
    </div></header>
    <div class="wrap">
      <div class="links" id="links"></div>
      <div class="addr" id="addr"></div>
      <input type="search" id="q" placeholder="🔍 ابحث عن منتج">
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>مفيش منتجات مطابقة.</p>
    </div>
    <footer class="foot">مدعوم بـ <a href="index.html">KlikShop</a></footer>
  </div>

  <button class="cartfab" id="cartBtn" type="button" hidden>🛒 السلة (<span id="cartCount">0</span>)</button>

  <!-- تفاصيل المنتج -->
  <div class="ov" id="pOv" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="x" id="pClose" type="button" aria-label="إغلاق">✕</button>
      <div class="gal"><img id="pMain" alt=""><div class="gthumbs" id="pThumbs"></div></div>
      <h2 id="pName"></h2>
      <div class="pprice" id="pPrice"></div>
      <p class="desc" id="pDesc"></p>
      <div id="pSizesBox"><label>المقاس</label><div class="opts" id="pSizes"></div></div>
      <div id="pColorsBox"><label>اللون</label><div class="opts" id="pColors"></div></div>
      <div class="qty"><button id="qMinus" type="button">−</button><span id="qVal">1</span><button id="qPlus" type="button">+</button></div>
      <div class="err" id="pErr" hidden></div>
      <button class="btn" id="addBtn" type="button">🛒 أضف للسلة</button>
    </div>
  </div>

  <!-- السلة -->
  <div class="ov" id="cOv" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="x" id="cClose" type="button" aria-label="إغلاق">✕</button>
      <h2>🛒 سلتك</h2>
      <div id="cBody">
        <div id="cItems"></div>
        <div class="total"><span>الإجمالي</span><span id="cTotal"></span></div>
        <label for="cName">اسمك</label><input id="cName" maxlength="80" autocomplete="name">
        <label for="cPhone">رقم موبايلك</label><input id="cPhone" type="tel" dir="ltr" maxlength="20" autocomplete="tel">
        <label for="cNote">ملاحظات (اختياري)</label><textarea id="cNote" rows="2" maxlength="400"></textarea>
        <div class="err" id="cErr" hidden></div>
        <button class="btn wa" id="sendBtn" type="button">📲 إرسال الطلب عبر واتساب</button>
      </div>
      <div id="cDone" hidden>
        <div class="ok" id="cDoneMsg"></div>
        <a class="btn wa" id="waAgain" href="#" target="_blank" rel="noopener">📲 افتح واتساب</a>
        <button class="btn ghost" id="cBack" type="button">رجوع للكتالوج</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="store.js"></script>
</body>
</html>
